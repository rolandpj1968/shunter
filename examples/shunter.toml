# Shunter's configuration: one file, read by `shunter serve --config` and
# `shunter shadow --config`. Every value here is an example. A key Shunter
# does not know is an error, so a misspelt deadline is never silently the
# default. Relative paths are relative to this file.

# The store: the queue's one record (I8). One daemon owns it at a time.
store = "/var/lib/shunter/store"
# The CLI's socket. Default: <store>/shunter.sock.
# socket = "/run/shunter/shunter.sock"

[repo]
forge = "github"                   # the only forge so far
# api = "https://api.github.com"   # or a GitHub Enterprise root
owner = "example-org"
name = "example-repo"
trunk = "main"
# The token: from this environment variable (default GH_TOKEN), else from
# the command's output. It is never logged.
token_env = "GH_TOKEN"
token_command = ["gh", "auth", "token"]
# The gate (§5.2) accepts changes from these authors, or labelled
# approved_label. Empty: every author.
authors = ["example-bot", "example-dev"]
approved_label = "queue-approved"
# A file of changes approved whoever wrote them, one or more ids a line,
# read at every gate. Missing: none. Relative to this file.
# approved_file = "approved-changes.list"
# An author approved only for changes from branches matching a regular
# expression; every other author is as `authors` says.
# [repo.author_branches]
# example-refresh-bot = "^refresh/"
# A change that landed in a train is closed with this label: the forge does
# not see it as merged. A merged change is landed whatever its labels.
landed_label = "landed"
# The least time between two API requests.
min_gap = "200ms"

[git]
# A clone Shunter owns. Nothing else works in it.
dir = "/var/lib/shunter/clone"
remote = "origin"
# Train branches: <branch_prefix><train>. Shunter force-pushes them.
branch_prefix = "shunter/"
# Where the forge keeps a change's head; {id} is the change.
change_ref = "refs/pull/{id}/head"
# "rebase" replays each change's own commits onto the train: a linear trunk.
# "merge" merges each change's head with a merge commit.
strategy = "rebase"
# Added to git's environment: the committer of rebased commits.
env = ["GIT_COMMITTER_NAME=Shunter", "GIT_COMMITTER_EMAIL=shunter@example.com"]
# The repository's merge drivers (.gitattributes merge=<name>) are git
# configuration, given here too: they apply to a build by either strategy and
# to the re-offer's merge test. Without one, git merges that file as text.
# A generated file's driver is false, so that it always surfaces as a
# conflict for [hooks.conflict] to regenerate:
#   env = [..., "GIT_CONFIG_COUNT=2",
#          "GIT_CONFIG_KEY_0=merge.regenerate.driver", "GIT_CONFIG_VALUE_0=false",
#          "GIT_CONFIG_KEY_1=merge.keys.driver", "GIT_CONFIG_VALUE_1=/path/to/driver %O %A %B"]
# Files the conflict hook resolves, as attribute=value: a conflict with trunk
# only in such files doesn't keep a returned line from being offered again.
# Needs git 2.40 or later.
resolvable = ["merge=regenerate"]
# The trunk push lock: a file every pusher of trunk holds with flock(2) to
# push, Shunter and any other (a legacy queue during a cut-over, a person's
# hotfix). A holder that dies frees it. One held past trunk_lock_max_hold,
# or by an orphan child of a holder that died, is stale: reported, never
# broken. See docs/cutover.md. Unset: no lock.
trunk_lock = "/var/lib/shunter/trunk.lock"
trunk_lock_wait = "2m"
trunk_lock_max_hold = "15m"

[ci]
# "checks": the train's pull request starts CI. "dispatch": Shunter also
# dispatches the workflow on the train's branch.
mode = "checks"
workflow = "ci.yml"
# The checks whose success, on exactly the train's head, is the verdict
# (I1, I9). Every one must have completed with success.
checks = ["check"]

[queue]
depth = 2       # the speculation chain: trains in flight at once
max_lines = 8   # lines in one train (J4)
# max_changes = 12  # changes in one train, every change of a stack counted;
#                   # unset or 0 is no cap. A line bigger than the cap rides alone.
# require_check = true  # no line joins a train without a current green line
#                       # check (§5.4). Read when the store is created; on a
#                       # running queue: shunt config require-check on|off --reason
# drafts = true    # show each train from assembly as a draft pull request,
#                   # promoted (CI starts) when its pre-flight passes. A workflow
#                   # run by pull request events should skip drafts.
# starve_after_cycles = 3  # a line that went round this many cycles it did not
#                          # cause rides first, at the head of the next train;
#                          # 0 is off
# starve_after_hours = 12  # or this much queue time; 0 is off
# starve_alert = 3         # this many starving at once is raised to the judge
# starve_alone_after = 1   # a starving line rides alone, not at the head of a
#                          # full train, once it has been in this many failed
#                          # trains since its last offer that blame could not
#                          # clear it from (J1); 0 is never

[deadlines]
# Every wait has one (§2.5). Shown: the defaults.
tick = "5s"     # how often timers run
poll = "30s"    # how often a testing train's CI is read
call = "2m"     # one adapter call that is not a build or a push
build = "30m"   # assembly and pre-flight; past it: void, no verdict (T2)
open = "10m"    # a built train waiting for its pull request (T6)
ci = "90m"      # a train in testing; past it: void, no verdict (T7)
push = "5m"     # one push to trunk; an unknown outcome is settled by reading trunk
j1 = "10m"      # J1's deadline, then its default
park = "24h"    # a park whose condition cannot be tested is restored then
claim = "30m"   # a line checker's claim (`shunt claim`), unless it names its own lease
unanswered = "10m" # a line check given up with no verdict (`checked --action infra`) is offered again after this
check_silence = "45m" # with require_check on, the judge is told when the line checker has been silent this long with a line waiting for it

[retry]
# Inside one adapter call: tries, and the waits between them.
attempts = 3
backoff = "2s"
max_backoff = "30s"
# Across calls, in the daemon: tries of one effect before J3 is alerted. A train's
# own build, pull request and rerun are retried until the train's deadline instead.
effects = 3
effect_backoff = "5s"

# Hooks: the repository's own rules, in any language. Each reads one JSON
# document on stdin and answers one on stdout. A hook advises; no hook can
# make a train pass. Verdicts come only from CI's checks. hooks/ has generic
# examples (pre-flight steps, regenerating generated files, blame by line);
# hooks/README.md says how to plug them in.
[hooks.preflight]
# In: {"dir","train","base","head","lines":[{"ID","Changes":[{"ID","Head"}]}],
#      "tips":{"<line>":"<its last commit in the train>"}}
# Out: {"pass":true} or {"pass":false,"blamed":["<line>"],"evidence":"..."}
# or {"pass":false,"left_out":{"<line>":"<why>"}}: those lines didn't fit
# this train; they go back uncharged, and the train is built again without
# them (the rest of that answer is not read).
# A crash, a timeout or no JSON is no verdict, never a charge.
# A passing hook may commit on top of the train (a regeneration, a counters
# update): the built head is then its last commit. It may only add commits;
# give it a committer identity in env.
command = ["./hooks/preflight"]
timeout = "20m"

[hooks.conflict]
# In: {"dir","train","line","change","files":[...]}, with the conflict in
# the tree. Out: {"resolved":true} with every file staged, or
# {"resolved":false,"reason":"..."}.
command = ["./hooks/resolve-conflict"]
timeout = "5m"

[tiers]
# Optional. Content that no build, test or generator reads is "inert": a line
# of nothing else takes the light tier and joins any train whatever its size
# (PROTOCOL.md §5.4). Patterns are slash-separated; "**" is any number of
# directories. The classifier can only err towards the full tier: a file
# under no inert pattern, or under a read pattern, makes its line full.
# inert = ["docs/**", "**/*.md"]
# read = ["docs/generated/**", "README.md"]   # read by a test or a generator: never inert

[hooks.rebase]
# Optional. Asked for a waiting line whose check found that it does not merge
# onto trunk. In: {"dir","remote","trunk","line":{"ID","Changes":[...]}}.
# Out: {"heads":{"<change>":"<new head>"}} once it has rebased and PUSHED
# them (through whatever tests the producers' own pushes), or
# {"conflict":"<what needs a person>"}. Rebase only what needs no person:
# generated files, a counters file, both sides only adding lines.
# command = ["./hooks/rebase"]
# timeout = "15m"

# An owner is live while its heartbeat is fresh: one file a producer in
# this directory, named as the producer offers lines (its actor), touched
# while it works. A producer that finishes stops touching it. A line that
# waits on an owner who is not live (charged, or stale or in conflict) has
# no owner, and is told to the judge after `ownerless`, then each `owner`
# deadline. An alert only. Without `heartbeats`, every named owner is live.
# [owners]
# heartbeats = "/var/lib/shunter/heartbeats"
# alive = "30m"
# ownerless = "1h"

# Under [deadlines], two alerts that act on nothing:
#   review = "24h"   # a hold that has stood this long is told to the judge, each time it passes
#   owner = "12h"    # so is a charged line that has stayed this long with its owner

[hooks.blame]
# In: {"train","head","lines":[...],"checks":[...],"evidence":"..."}
# Out: {"class":"deterministic","blamed":["<line>"],"evidence":"..."}, or
# class "flaky", "infra" or "no-verdict". Lines not in the train are
# ignored. A failure nobody is named for goes to J1 (I6).
# With "force_class":"deterministic" in the input (a flake's or a timing
# failure's one rerun failed again, §5.5), only that class names lines.
command = ["./hooks/blame"]
timeout = "2m"

[hooks.gate]
# Optional: the repository's own rules at the gate (§5.2), asked after
# Shunter's own (open, approved, not queued twice, its base).
# In: {"line","changes":[{"id","head","base"}],"alone","trunk"}
# Out: {"refuse":"<reason the producer is told>"}, or {} to let it in.
# No answer refuses nothing.
command = ["./hooks/gate"]
timeout = "1m"

[notify]
# Every notice to an owner or the judge, one JSON line each. Default:
# <store>/events.jsonl.
events = "/var/lib/shunter/events.jsonl"
# Optional delivery: the notice as JSON on stdin. An owner's notice says the
# state its line went to (empty for advice) and the cause (hooks/notify.py).
command = ["./hooks/notify"]
timeout = "30s"

# The outside watcher: `shunter watch --config FILE`, run from a timer (a
# systemd timer or cron, every five minutes). It checks the daemon from
# outside: the store's lock held, the socket answering, no restart loop, no
# effect or train past its deadline plus grace, lines not stalled, the trunk
# lock not stale. It raises each finding through [notify]'s command once,
# again every realert while it stands, and says when it clears. It exits 1
# while anything is wrong. Shown: the defaults.
[watch]
# state = "/var/lib/shunter/watch.json"   # default <store>/watch.json
grace = "15m"     # added to every deadline
stall = "30m"     # lines waiting, nothing in flight, nothing recorded
realert = "1h"
restarts = 3      # daemon starts in an hour that are too many
