\* The small configuration of Shunter.cfg, with the second line stacked on
\* the first (Stack.tla): needs first, I3.
CONSTANTS
    l1 = l1
    l2 = l2
    Lines = {l1, l2}
    Needs <- StackNeeds
    Inert = {}
    MaxTrains = 10
    Depth = 2
    MaxFaults = 1
    StarveAt = 1

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OneRecord
    TestedTrunk
    ExactSpeculation
    Frozen
    CancelledNeverLands
    HeldNotRiding
    AssembledOnlyChecked
    NeedsFirst
    NoRideInConflict
    LightOnlyIfAllInert
    NoRideAtChargedHead

PROPERTIES
    FastForwardOnly
    EndedStaysEnded
    HeldNeverSpent
    SpentStaysSpent
    GreenOnlyByACheck
    JudgedOnlyAtHead
    NeededRebaseOnly
    ChargedOnlyAtPresentHead
    VerdictsByPresentChecker
    NoJump
    ForcedFirst
    CountFallsOnlyByACharge
    NoStackOnRed
    EveryLineIsSpent
