\* The small configuration of Shunter.cfg, with the second line stacked on
\* the first (Stack.tla): needs first, I3.
CONSTANTS
    l1 = l1
    l2 = l2
    Lines = {l1, l2}
    Needs <- StackNeeds
    MaxTrains = 6
    Depth = 2
    MaxFaults = 1

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OneRecord
    TestedTrunk
    ExactSpeculation
    Frozen
    CancelledNeverLands
    HeldNotRiding
    AssembledOnlyChecked
    NeedsFirst

PROPERTIES
    FastForwardOnly
    EndedStaysEnded
    HeldNeverSpent
    SpentStaysSpent
    GreenOnlyByACheck
    JudgedOnlyAtHead
    EveryLineIsSpent
