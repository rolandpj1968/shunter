\* Two faults, so that a charged line can be fixed by a push and offered
\* again, which one fault cannot reach. About 610,000 states.
CONSTANTS
    Lines = {l1, l2}
    Needs = {}
    Inert = {}
    MaxTrains = 8
    Depth = 2
    MaxFaults = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OneRecord
    TestedTrunk
    ExactSpeculation
    Frozen
    CancelledNeverLands
    HeldNotRiding
    AssembledOnlyChecked
    NeedsFirst
    NoRideInConflict
    LightOnlyIfAllInert
    NoRideAtChargedHead

PROPERTIES
    FastForwardOnly
    EndedStaysEnded
    HeldNeverSpent
    SpentStaysSpent
    GreenOnlyByACheck
    JudgedOnlyAtHead
    NeededRebaseOnly
    ChargedOnlyAtPresentHead
    EveryLineIsSpent
