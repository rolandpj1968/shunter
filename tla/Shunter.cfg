\* The small configuration: two lines, speculation one train ahead, and an
\* adversary with one fault. See README.md for larger ones.
CONSTANTS
    Lines = {l1, l2}
    MaxTrains = 6
    Depth = 2
    MaxFaults = 1

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OneRecord
    TestedTrunk
    ExactSpeculation
    Frozen
    CancelledNeverLands
    HeldNotRiding
    AssembledOnlyChecked

PROPERTIES
    FastForwardOnly
    EndedStaysEnded
    HeldNeverSpent
    SpentStaysSpent
    GreenOnlyByACheck
    EveryLineIsSpent
