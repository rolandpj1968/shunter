\* The small configuration: two lines, neither stacked, one of them inert
\* content (so that light trains occur), speculation one train
\* ahead, and an adversary with one fault. Stack.cfg is the same with the
\* second line stacked on the first. See README.md for larger ones.
CONSTANTS
    Lines = {l1, l2}
    Needs = {}
    Inert = {l2}
    MaxTrains = 10
    Depth = 2
    MaxFaults = 1
    StarveAt = 1

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OneRecord
    TestedTrunk
    ExactSpeculation
    Frozen
    CancelledNeverLands
    HeldNotRiding
    AssembledOnlyChecked
    NeedsFirst
    NoRideInConflict
    LightOnlyIfAllInert
    NoRideAtChargedHead

PROPERTIES
    FastForwardOnly
    EndedStaysEnded
    HeldNeverSpent
    SpentStaysSpent
    GreenOnlyByACheck
    JudgedOnlyAtHead
    NeededRebaseOnly
    ChargedOnlyAtPresentHead
    VerdictsByPresentChecker
    NoJump
    ForcedFirst
    CountFallsOnlyByACharge
    NoStackOnRed
    EveryLineIsSpent
