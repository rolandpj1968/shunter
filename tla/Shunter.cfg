\* The small configuration: two lines, neither stacked, speculation one train
\* ahead, and an adversary with one fault. Stack.cfg is the same with the
\* second line stacked on the first. See README.md for larger ones.
CONSTANTS
    Lines = {l1, l2}
    Needs = {}
    MaxTrains = 6
    Depth = 2
    MaxFaults = 1

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OneRecord
    TestedTrunk
    ExactSpeculation
    Frozen
    CancelledNeverLands
    HeldNotRiding
    AssembledOnlyChecked
    NeedsFirst
    NoRideAtChargedHead

PROPERTIES
    FastForwardOnly
    EndedStaysEnded
    HeldNeverSpent
    SpentStaysSpent
    GreenOnlyByACheck
    JudgedOnlyAtHead
    ChargedOnlyAtPresentHead
    EveryLineIsSpent
