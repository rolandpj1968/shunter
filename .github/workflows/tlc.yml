# Model-checks tla/Shunter.tla with TLC on every change to the model, and
# fails on any invariant or liveness violation, a parse error, or the time
# limit. The bounds are the small configurations: tla/Shunter.cfg, and
# tla/Stack.cfg, the same with one line stacked on the other; and
# tla/Reoffer.cfg, with two faults, which reaches a fixed line's re-offer.
name: tlc

on:
  push:
    branches: [main]
    paths: ["tla/**", ".github/workflows/tlc.yml"]
  pull_request:
    paths: ["tla/**", ".github/workflows/tlc.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tlc-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: a release whose asset does not change, checked by its digest.
  TLA_TOOLS_VERSION: v1.7.4
  TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One job a configuration, so that each has the whole time limit and a
    # failure names its configuration.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cfg: Shunter.cfg, module: Shunter.tla }
          - { cfg: Stack.cfg, module: Stack.tla }
          - { cfg: Reoffer.cfg, module: Shunter.tla }
    name: tlc (${{ matrix.cfg }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch tla2tools.jar and check its digest
        run: |
          curl -fsSL --retry 3 -o tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_TOOLS_VERSION}/tla2tools.jar"
          echo "${TLA_TOOLS_SHA256}  tla2tools.jar" | sha256sum --check --strict

      - name: Parse and check semantics (SANY)
        working-directory: tla
        run: |
          java -cp ../tla2tools.jar tla2sany.SANY Shunter.tla
          java -cp ../tla2tools.jar tla2sany.SANY Stack.tla

      # TLC exits non-zero on any invariant or property violation, and on a
      # parse or configuration error. -deadlock: a queue with every line spent
      # has nothing left to do, which is a legitimate end, not a deadlock.
      - name: Model-check (TLC)
        working-directory: tla
        run: |
          timeout 25m java -XX:+UseParallelGC -Xmx5g -cp ../tla2tools.jar tlc2.TLC \
            -workers auto -deadlock -cleanup -config ${{ matrix.cfg }} ${{ matrix.module }}

      # The witnesses must fail: each names a state the properties are about,
      # and a pass would mean the model never reaches it.
      - name: Witnesses (TLC must report each violated)
        if: matrix.cfg == 'Shunter.cfg'
        working-directory: tla
        run: |
          for w in forced:NeverForcedPast void:NeverVoided; do
            timeout 10m java -XX:+UseParallelGC -Xmx5g -cp ../tla2tools.jar tlc2.TLC \
              -workers auto -deadlock -cleanup -config "Witness-${w%%:*}.cfg" Shunter.tla | tee witness.out || true
            grep -q "${w##*:} is violated" witness.out
          done
